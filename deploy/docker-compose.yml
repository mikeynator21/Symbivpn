# The simplest way to run SymbiVPN on a home server or NAS.
#
#   docker compose up -d
#   docker compose exec symbivpn symbivpn status
#
# Then point your router's DHCP "DNS server" setting at this host, and every
# device on every network behind that router is filtered.

services:
  symbivpn:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: symbivpn
    restart: unless-stopped

    # Host networking so the resolver sees real client addresses. Without it
    # every query appears to come from the Docker bridge and per-device rules
    # cannot work.
    network_mode: host

    cap_add:
      - NET_ADMIN          # nftables rules and the WireGuard interface
      - NET_BIND_SERVICE   # port 53
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    volumes:
      - symbivpn-state:/var/lib/symbivpn
      - ./symbivpn.toml:/etc/symbivpn/symbivpn.toml:ro
      # Only needed when the VPN is in use.
      - /etc/wireguard:/etc/wireguard

    sysctls:
      net.ipv4.ip_forward: "1"

    environment:
      SYMBIVPN_STATE: /var/lib/symbivpn

volumes:
  symbivpn-state:
