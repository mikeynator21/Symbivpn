[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "symbivpn"
version = "1.0.0"
description = "Network-wide ad blocker, encrypted DNS resolver and portable VPN gateway"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "mikeynator21" }]
keywords = ["dns", "adblock", "vpn", "wireguard", "privacy", "gateway", "pihole"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: Name Service (DNS)",
    "Topic :: Security",
    "Topic :: System :: Networking :: Firewalls",
]

# Deliberately empty. SymbiVPN runs on the standard library alone, so it
# installs on a Raspberry Pi, a router, or a phone under Termux without a
# compiler or a package index.
dependencies = []

[project.urls]
Homepage = "https://github.com/mikeynator21/Symbivpn"

[project.scripts]
symbivpn = "symbivpn.cli:main"

[tool.setuptools.packages.find]
include = ["symbivpn*"]

[tool.setuptools.package-data]
symbivpn = ["web/*.html", "web/*.css", "web/*.js"]
