name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: unit tests (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor (tomllib); the newest is what most people will
        # actually have. Both are tested because the project promises to run
        # on the standard library alone, and that promise is version-shaped.
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: No dependencies to install
        run: python -c "import sys; print(sys.version)"
      - name: Byte-compile everything
        run: python -m compileall -q symbivpn tests
      - name: The downloadable cipher box is current
        run: python tools/build_cipherbox.py --check
      - name: Run the unit tests
        run: python -m unittest discover -s tests -v

  selftest:
    name: self-test (the real stack on loopback)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run the self-test
        env:
          SYMBIVPN_STATE: ${{ runner.temp }}/symbivpn-state
        run: python -m symbivpn.cli selftest --port 15353

  integration:
    name: integration (a virtual network in namespaces)
    runs-on: ubuntu-latest
    # This spent a long time failing here and passing everywhere else, and the
    # reason was reverse path filtering, which GitHub's runners have on.
    #
    # A DHCPOFFER is broadcast to a client that has no address yet and so no
    # route back to the server. That is precisely what rp_filter drops: the
    # frame reaches the client's interface and no socket ever sees it. The
    # request was always arriving -- counters say the phone sent 11 packets and
    # the bridge received 18 -- so every theory about the request being lost
    # was looking the wrong way down the wire.
    #
    # It is also why dhclient, dhcpcd, Android and iOS all read their replies
    # off a packet socket rather than a UDP one. The testbed's client used UDP,
    # which works only where rp_filter is off. It uses AF_PACKET now, like a
    # real client, and the testbed turns rp_filter *on* in every namespace so
    # it proves the gateway on the stricter machine rather than the permissive
    # one.
    #
    # SymbiVPN itself was never at fault: the server received every DISCOVER
    # and offered an address each time.
    steps:
      - uses: actions/checkout@v4
      - name: Install the tools the testbed drives
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            nftables iproute2 bind9-dnsutils openssl
      - name: Can this runner carry a broadcast across a bridge, both ways?
        # Isolates the kernel behaviour the testbed rests on, independently of
        # SymbiVPN, in both directions. Several guesses at why this job failed
        # were wrong because they only ever tested the request; the answer
        # coming back was the half that did not work. It asks directly now.
        run: sudo python3 tests/integration/preflight.py
      - name: Run the testbed
        # Root, because it builds network namespaces and loads nftables rules.
        # The runner's own python3 is used: sudo resets PATH, and ubuntu-latest
        # ships one newer than the 3.11 floor.
        run: sudo ./tests/integration/run.sh

  scripts:
    name: shell scripts parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check every shell script
        run: |
          status=0
          while IFS= read -r script; do
              if bash -n "$script"; then
                  echo "ok   $script"
              else
                  echo "FAIL $script"
                  status=1
              fi
          done < <(find . -name '*.sh' -not -path './.git/*')
          exit $status
